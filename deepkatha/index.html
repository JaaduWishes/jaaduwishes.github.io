<style>
/* Scenes sit on backdrops (cloth, night, the Sarayu). #wc holds the floating diyas and the name; #fx holds arrows, embers, petals and fireworks. */
:root {
  --ink: #fff3e2; --muted: #f1d3b6; --gold: #f5c35a; --saffron: #ff9a2e; --deep: #14060a; --maroon: #7a1020; --vermilion: #c0281e;
  --paper: #f4e4c4; --paper-ink: #3d1a0c;
  --f-deva: "Yatra One", "Tiro Devanagari Hindi", serif; --f-tiro: "Tiro Devanagari Hindi", serif; --f-hand: "Kalam", cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--deep); color: var(--ink); overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { font-family: var(--f-hand); }
button { font: inherit; color: inherit; cursor: pointer; }

.bd { position: fixed; inset: -3%; background: center / cover no-repeat; opacity: 0; transition: opacity 1.6s ease; }
.bd.on { opacity: 1; }
#bd-night { background: radial-gradient(1.4px 1.4px at 20% 30%, #fff8 50%, transparent), radial-gradient(1px 1px at 70% 20%, #fff7 50%, transparent),
  radial-gradient(1.2px 1.2px at 40% 70%, #fff6 50%, transparent), radial-gradient(1px 1px at 85% 60%, #fff6 50%, transparent),
  radial-gradient(1.3px 1.3px at 10% 80%, #fff5 50%, transparent), radial-gradient(1px 1px at 55% 45%, #fff6 50%, transparent),
  radial-gradient(120% 80% at 50% 110%, #5a1420 0%, #2a0a1a 45%, #14060a 80%); background-size: 180px 180px, 230px 230px, 200px 200px, 260px 260px, 210px 210px, 170px 170px, cover; }
#bd-cloth { background: radial-gradient(circle at 50% 50%, #f5c35a22 0 2px, transparent 3px) 0 0 / 28px 28px,
  radial-gradient(circle at 50% 50%, #f5c35a14 0 6px, transparent 7px) 14px 14px / 28px 28px,
  radial-gradient(100% 80% at 50% 30%, #8a1424 0%, #5a0c18 55%, #2a050c 100%); }
#bd-dark { background-image: url(sarayu.jpg); filter: brightness(.16) saturate(.4) contrast(1.1); }
#bd-lit { background-image: url(sarayu.jpg); transition: opacity 1.4s ease; }
#bd-lit.on { opacity: var(--lit, 0); }
#bd-lit::after, #bd-dark::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#14060acc, transparent 30%, transparent 60%, #14060a99); }
.drift { animation: drift 40s ease-in-out infinite alternate; }
@keyframes drift { to { transform: scale(1.06) translate(-1%, -1%); } }
#wc, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#wc { z-index: 1; } #fx { z-index: 6; }
body.finale #fx { z-index: 1; }

.scene { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: max(22px, env(safe-area-inset-top)) 18px max(22px, env(safe-area-inset-bottom)); text-align: center;
  opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s .9s; z-index: 2; }
.scene.on { opacity: 1; visibility: visible; transition: opacity .9s ease; }

.kicker { font-family: var(--f-deva); font-size: 18px; letter-spacing: .1em; color: var(--gold); margin: 0 0 12px; opacity: .9; }
.whisper { font-size: clamp(22px, 6vw, 29px); line-height: 1.42; color: var(--ink); max-width: 20ch; margin: 0 0 26px; text-shadow: 0 2px 18px #000; }
.whisper b { color: var(--gold); }
h2 { font-family: var(--f-deva); font-weight: 400; color: var(--gold); font-size: clamp(26px, 7.4vw, 34px); margin: 0 0 4px; text-shadow: 0 0 18px #ff9a2e66; }
.hint { font-size: 17px; color: var(--muted); margin: 0 0 6px; min-height: 1.4em; }
.btn { border: 0; border-radius: 999px; padding: 14px 26px; font-size: 19px; font-weight: 700;
  background: linear-gradient(180deg, #ffd98a, #f08a24); color: #3a1204; box-shadow: 0 0 0 1px #ffd27a66, 0 8px 30px #f08a2455; }
.btn.ghost { background: transparent; color: var(--gold); box-shadow: inset 0 0 0 1.5px #f5c35a88; font-weight: 400; }
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.05); box-shadow: 0 0 0 1px #ffd27a88, 0 8px 44px #f08a2499; } }
.later { opacity: 0; transform: translateY(10px); transition: opacity .8s, transform .8s; pointer-events: none; }
.later.on { opacity: 1; transform: none; pointer-events: auto; }

/* Intro: a pothi wrapped in red cloth with a gold cord. */
.mandala { position: absolute; width: min(120vw, 620px); aspect-ratio: 1; opacity: .16; animation: spin 90s linear infinite; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.pothi { position: relative; width: min(70vw, 280px); aspect-ratio: 2.3; margin: 0 auto 26px; border-radius: 10px;
  background: linear-gradient(160deg, #c0281e, #7a1020 70%); box-shadow: 0 18px 40px #000a, inset 0 0 0 3px #f5c35a55, inset 0 -10px 20px #0004; }
.pothi::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 8px; margin-top: -4px; background: linear-gradient(#ffe08a, #c8902e); box-shadow: 0 2px 4px #0006; }
.pothi::after { content: "॥ राम ॥"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 6px 14px; border-radius: 8px;
  background: radial-gradient(#ffe7a6, #e3a33c); color: #6a1006; font-family: var(--f-deva); font-size: 20px; box-shadow: 0 3px 8px #0007; }

/* Manuscript folio, used for the katha pages and the memories. */
.folio { position: relative; width: min(92vw, 52vh, 430px); padding: 16px 16px 14px; background:
  radial-gradient(circle at 20% 30%, #0000000a 0 1px, transparent 2px) 0 0 / 9px 9px, linear-gradient(170deg, #f8ead0, #ecd4a8);
  color: var(--paper-ink); border-radius: 4px;
  box-shadow: 0 0 0 6px #9b1c1c, 0 0 0 8px #e0a94a, 0 0 0 11px #6a0c14, 0 26px 60px #000c;
  transform-origin: 50% 50%; transition: transform .45s ease-in, opacity .45s; }
.folio.turn { transform: perspective(900px) rotateY(-88deg); opacity: .2; }
.folio .orn { position: absolute; font-size: 16px; color: #b5401e; line-height: 1; }
.folio .orn.tl { left: 4px; top: 3px; } .folio .orn.tr { right: 4px; top: 3px; } .folio .orn.bl { left: 4px; bottom: 3px; } .folio .orn.br { right: 4px; bottom: 3px; }
.folio .art { position: relative; overflow: hidden; border: 3px solid #c8902e; box-shadow: 0 0 0 2px #7a1020; background: #2a0a0a; aspect-ratio: 4 / 3.4; }
.folio.mem .art { aspect-ratio: 4 / 4.2; }
.folio .art img { display: block; width: 100%; height: 100%; object-fit: cover; animation: kb 10s ease-in-out infinite alternate; }
.folio.contain .art img { object-fit: contain; }
@keyframes kb { from { transform: scale(1.02); } to { transform: scale(1.14) translate(-2%, -2%); } }
.folio h3 { font-family: var(--f-deva); font-weight: 400; color: #8a1410; font-size: clamp(20px, 5.6vw, 25px); margin: 10px 0 2px; }
.folio .hi { font-family: var(--f-tiro); font-size: clamp(16px, 4.5vw, 19px); line-height: 1.5; margin: 6px 0 2px; }
.folio .en { font-size: clamp(15px, 4.2vw, 18px); line-height: 1.4; margin: 4px 0 0; color: #6a3a1c; }
.pager { margin-top: 22px; display: flex; gap: 12px; align-items: center; justify-content: center; }
.dots { display: flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: #ffffff33; transition: background .3s; } .dots i.on { background: var(--gold); }

/* Bow at the ghat. */
#s-bow { justify-content: space-between; touch-action: none; }
#s-bow .top { padding-top: 2vh; }
.bowwrap { position: relative; width: min(74vw, 300px); margin-bottom: 2vh; }
.bowwrap svg { width: 100%; display: block; overflow: visible; filter: drop-shadow(0 6px 14px #000c); }
.handhint { position: absolute; left: 50%; top: 58%; font-size: 34px; transform: translateX(-50%); animation: pullhint 1.8s ease-in-out infinite; pointer-events: none; }
@keyframes pullhint { 0%, 20% { transform: translate(-50%, 0); opacity: 0; } 35% { opacity: 1; } 75% { transform: translate(-50%, 60px); opacity: 1; } 100% { transform: translate(-50%, 60px); opacity: 0; } }
.arrows { font-size: 18px; color: var(--gold); margin: 0 0 6px; letter-spacing: .2em; }

/* Pushpak route over the memories. */
#s-yaad { justify-content: flex-start; padding-top: max(16px, env(safe-area-inset-top)); }
.route { position: relative; width: min(78vw, 400px); height: 54px; margin: 2px 0 22px; }
.route .line { position: absolute; left: 6%; right: 6%; top: 34px; border-top: 2px dashed #f5c35a88; }
.route .stop { position: absolute; top: 27px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #5a0c18; box-shadow: 0 0 0 2px #f5c35a; transition: background .4s, box-shadow .4s; }
.route .stop.on { background: var(--gold); box-shadow: 0 0 0 2px #fff3c4, 0 0 14px #f5c35a; }
.route .vimaan { position: absolute; top: 0; width: 64px; margin-left: -32px; transition: left 1.1s cubic-bezier(.5, 0, .3, 1); animation: hover 1.6s ease-in-out infinite alternate; }
@keyframes hover { to { transform: translateY(-4px); } }

/* Doors with a marigold toran, over the finale. */
#doors { position: fixed; inset: 0; z-index: 7; display: flex; perspective: 1400px; pointer-events: none; visibility: hidden; }
#doors.on { pointer-events: auto; visibility: visible; }
.door { position: relative; flex: 1; border: 0; padding: 0; background:
  radial-gradient(circle, #e7b55a 0 3px, #7a4a14 4px, transparent 5px) 0 0 / 46px 46px,
  linear-gradient(90deg, #3a1a08, #5a2c10 30%, #4a220c 70%, #2e1406); transition: transform 1.8s cubic-bezier(.5, 0, .2, 1); box-shadow: inset 0 0 60px #000a; }
.door.l { transform-origin: left center; border-right: 2px solid #1a0a02; } .door.r { transform-origin: right center; }
.door::before { content: ""; position: absolute; inset: 9% 12%; border: 4px solid #a8742e; border-radius: 40% 40% 4px 4px / 14% 14% 4px 4px; box-shadow: inset 0 0 0 8px #3a1a0866, 0 0 0 2px #2a1004; }
.door span { position: absolute; left: 0; right: 0; top: 46%; font-family: var(--f-deva); font-size: clamp(30px, 9vw, 46px); color: #f5c35a; text-shadow: 0 2px 0 #3a1404, 0 0 18px #f5c35a55; }
.door .ring { position: absolute; top: 58%; width: 34px; height: 34px; border-radius: 50%; border: 5px solid #d9a440; box-shadow: 0 3px 6px #000a; }
.door.l .ring { right: 14px; } .door.r .ring { left: 14px; }
#doors.open .door.l { transform: rotateY(-105deg); } #doors.open .door.r { transform: rotateY(105deg); }
.toran { position: absolute; left: 0; right: 0; top: 0; height: 90px; z-index: 2; pointer-events: none; transition: transform 1.4s ease-in, opacity 1.4s; }
#doors.open .toran { transform: translateY(-120%); opacity: 0; }
.doorcall { position: absolute; left: 0; right: 0; bottom: max(9vh, 40px); z-index: 3; text-align: center; transition: opacity .6s; }
#doors.open .doorcall { opacity: 0; }

/* Finale over the lit Sarayu. */
#s-finale { justify-content: flex-start; padding-top: max(6vh, env(safe-area-inset-top)); pointer-events: none; }
#s-finale > * { pointer-events: auto; }
#s-finale::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 34%; z-index: -1; pointer-events: none; background: linear-gradient(transparent, #14060af0 55%); }
#s-finale .hb { font-family: var(--f-deva); font-size: clamp(30px, 8.6vw, 44px); margin: 0; color: #ffe7b0; text-shadow: 0 0 14px #ff9a2e, 0 0 40px #c0281e; }
#nameSlot { height: clamp(88px, 15vh, 150px); width: 100%; pointer-events: none; }
#s-finale .sub { margin: 0; font-size: 18px; color: var(--muted); text-shadow: 0 2px 10px #000; }
.letter { margin-top: auto; width: min(100%, 420px); max-height: 44vh; overflow: auto; text-align: left; padding: 18px 20px 12px;
  background: linear-gradient(170deg, #f8ead0f5, #ecd4a8f5); color: var(--paper-ink); font-size: clamp(16px, 4.4vw, 19px); line-height: 1.5;
  border-radius: 4px; box-shadow: 0 0 0 4px #9b1c1c, 0 0 0 6px #e0a94a, 0 20px 60px #000c; transform: translateY(40px); opacity: 0; transition: transform 1s ease, opacity 1s ease; }
.letter.on { transform: none; opacity: 1; }
.letter p { margin: 0 0 8px; }
.letter .sign { text-align: right; font-family: var(--f-deva); font-size: 24px; margin: 0; color: #8a1410; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.row .btn { padding: 11px 18px; font-size: 16px; }
.tip { font-size: 14px; color: var(--muted); opacity: .85; margin: 12px 0 0; }
.made { font-size: 13px; color: var(--muted); opacity: .8; margin: 10px 0 0; }
.made a { color: var(--gold); }
.made summary { cursor: pointer; display: inline; }
.made details[open] { text-align: left; max-width: 420px; margin: 6px auto 0; }
.made details p { margin: 4px 0; }

#mute { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 9; width: 40px; height: 40px; border-radius: 50%;
  border: 0; background: #ffffff18; font-size: 18px; display: none; }
#mute.on { display: block; }

@media (max-height: 700px) {
  #nameSlot { height: 72px; }
  .letter { max-height: 34vh; }
  .folio { width: min(86vw, 46vh, 400px); }
}
@media (prefers-reduced-motion: reduce) {
  .drift, .pulse, .mandala, .folio .art img, .handhint, .route .vimaan { animation: none !important; }
}
</style>
</head>
<body>
<div class="bd on" id="bd-night"></div>
<div class="bd" id="bd-cloth"></div>
<div class="bd drift" id="bd-dark"></div>
<div class="bd drift" id="bd-lit"></div>
<canvas id="wc"></canvas>
<canvas id="fx"></canvas>
<button id="mute" type="button" aria-label="Mute">🔊</button>

<section class="scene on" id="s-intro">
  <svg class="mandala" viewBox="0 0 100 100" aria-hidden="true" id="mandala"></svg>
  <p class="kicker">॥ दीप कथा ॥</p>
  <div class="pothi" aria-hidden="true"></div>
  <p class="whisper" id="introLine"></p>
  <button class="btn pulse" id="openBtn" type="button">📜 Pothi kholo</button>
</section>

<section class="scene" id="s-katha">
  <article class="folio contain" id="kFolio">
    <span class="orn tl">❁</span><span class="orn tr">❁</span><span class="orn bl">❁</span><span class="orn br">❁</span>
    <div class="art"><img id="kImg" alt=""></div>
    <p class="hi" id="kHi"></p>
    <p class="en" id="kEn"></p>
  </article>
  <div class="pager"><div class="dots" id="kDots"></div><button class="btn pulse" id="kNext" type="button">Aage ›</button></div>
</section>

<section class="scene" id="s-bow">
  <div class="top">
    <h2>सरयू तट</h2>
    <p class="hint" id="bowHint">Dhanush ko neeche kheencho… aur chhodo 🏹</p>
    <p class="arrows" id="arrows">🔥 🔥 🔥</p>
  </div>
  <div>
    <p class="whisper later" id="bowDone" style="margin-bottom:14px"></p>
    <button class="btn pulse later" id="toYaad" type="button">✨ Yaadon ka Pushpak</button>
    <div class="bowwrap" id="bowwrap">
      <svg viewBox="0 -70 200 200" aria-hidden="true">
        <defs><linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#6a2a0a"/><stop offset=".5" stop-color="#c8902e"/><stop offset="1" stop-color="#6a2a0a"/></linearGradient>
          <radialGradient id="flame"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#ffd27a"/><stop offset=".7" stop-color="#ff7a1f"/><stop offset="1" stop-color="#ff3a0000"/></radialGradient></defs>
        <path d="M8 74 Q100 -18 192 74" fill="none" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/>
        <path d="M8 74 Q100 -18 192 74" fill="none" stroke="#f5c35a" stroke-width="1.5" stroke-dasharray="2 6"/>
        <circle cx="100" cy="28" r="7" fill="#9b1c1c" stroke="#f5c35a" stroke-width="2"/>
        <path id="string" d="M8 74 L100 74 L192 74" fill="none" stroke="#f6ead0" stroke-width="2"/>
        <g id="arrow">
          <line x1="100" y1="74" x2="100" y2="-46" stroke="#e8c88a" stroke-width="3.5"/>
          <path d="M100 -60 L93 -44 L107 -44z" fill="#d9d2c0"/>
          <path d="M100 74 l-8 10 M100 74 l8 10 M100 64 l-8 10 M100 64 l8 10" stroke="#c0281e" stroke-width="3"/>
          <circle id="tipFire" cx="100" cy="-56" r="14" fill="url(#flame)" opacity="0"/>
        </g>
      </svg>
      <div class="handhint" id="handhint">👆</div>
    </div>
  </div>
</section>

<section class="scene" id="s-yaad">
  <div class="route" id="route">
    <div class="line"></div>
    <svg class="vimaan" id="vimaan" viewBox="0 0 64 34" aria-hidden="true">
      <path d="M6 22 Q32 34 56 22 L52 16 H10z" fill="#e8b04a" stroke="#7a3a08" stroke-width="1.2"/>
      <path d="M18 16 V8 Q31 0 44 8 V16" fill="#c0281e" stroke="#f5c35a" stroke-width="1.2"/>
      <path d="M56 22 Q64 10 57 6 Q52 5 53 10" fill="none" stroke="#fff6e6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="56" cy="7" r="1" fill="#000"/>
      <path d="M6 22 Q0 16 4 12" fill="none" stroke="#fff6e6" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
  <article class="folio mem" id="mFolio">
    <span class="orn tl">❁</span><span class="orn tr">❁</span><span class="orn bl">❁</span><span class="orn br">❁</span>
    <div class="art"><img id="mImg" alt=""></div>
    <h3 id="mTitle"></h3>
    <p class="en" id="mText"></p>

<section class="scene" id="s-finale">
  <p class="hb">शुभ दीपावली</p>

  <div class="row"><button class="btn ghost" id="replay" type="button">↺ Phir se</button></div>
  <div class="made">
    ✨ Ye ek <a href="../?utm_source=surprise&amp;utm_medium=deepkatha" data-umami-event="sample-cta" data-umami-event-which="deepkatha">Jaadu Wishes</a> sample hai · apno ke liye banwao, <b>₹50 off</b>
    <details><summary>· Chitra &amp; sangeet credits</summary><div id="credits"></div></details>
  </div>
</section>

<div id="doors">
  <svg class="toran" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true" id="toran"></svg>
  <button class="door l" type="button" aria-label="Dwar kholo"><span>शुभ</span><i class="ring"></i></button>
  <button class="door r" type="button" aria-label="Dwar kholo"><span>लाभ</span><i class="ring"></i></button>
  <div class="doorcall"><p class="whisper" style="margin:0 auto 14px">Ab ghar ka <b>dwar</b> kholo…</p><button class="btn pulse" id="doorBtn" type="button">🚪 Dwar kholo</button></div>
</div>

<script>
// Who it's from and for. KATHA pages use the public-domain paintings in k/; MEMORIES pair a photo in p/ with a title and one line.
const TO = "Dadi", TO_HI = "दादी", FROM = "Ishaan";
const INTRO = `${TO}, bachpan mein aapne mujhe Ramayan sunayi thi…<br><b>aaj meri baari hai.</b>`;
const KATHA = [
  { img: "k/1.jpg", hi: "चौदह बरस का वनवास पूरा हुआ…", en: "14 saal baad, Ram ji ghar lautne nikle." },
  { img: "k/2.jpg", hi: "पुष्पक विमान में बैठ कर राम, सीता और लक्ष्मण अयोध्या की ओर उड़े।", en: "Pushpak vimaan, aasmaan ke raaste Ayodhya ki ore ✨" },
  { img: "k/3.jpg", hi: "और उस रात अयोध्या ने हर घर में दीप जलाकर उनका स्वागत किया।", en: "Usi raat se Diwali hai. Ab ek diya aapke liye… 🪔" },
];

// Sound: music from the first tap; a conch opens the pothi and the doors.
const music = new Audio("a/music.m4a"); music.loop = true; music.volume = .55;
let muted = false;
const sfx = (n, vol = .7) => { if (muted) return; const a = new Audio(`a/${n}.mp3`); a.volume = vol; a.play().catch(() => {}); return a; };
$("mute").addEventListener("click", () => { muted = !muted; music.muted = muted; $("mute").textContent = muted ? "🔇" : "🔊"; });

// Canvases.
const fx = $("fx"), c = fx.getContext("2d"), wc = $("wc"), w2 = wc.getContext("2d");
let W, H, dpr;
function size() {
  dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  for (const cv of [fx, wc]) { cv.width = W * dpr; cv.height = H * dpr; }
  c.setTransform(dpr, 0, 0, dpr, 0, 0); w2.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (word) layoutWord();
}
const parts = [], flashes = [], embers = [], lamps = [], petals = [];
function spark(x, y, n, opt = {}) {
  for (let i = 0; i < n; i++) {
    const a = opt.dir != null ? opt.dir + (Math.random() - .5) * (opt.spread ?? .6) : Math.random() * Math.PI * 2, v = (opt.speed || 3) * (.3 + Math.random());
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0, max: (opt.life || 22) * (.6 + Math.random() * .8),
      hue: opt.hue ?? 28 + Math.random() * 20, g: opt.g ?? .06, drag: opt.drag ?? .96, w: opt.w || 1.4 });
  }
}
function drawParts() {
  c.globalCompositeOperation = "lighter";
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i], k = 1 - p.life / p.max;
    if (k <= 0) { parts.splice(i, 1); continue; }
    const px = p.x, py = p.y;
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life++;
    c.strokeStyle = `hsla(${p.hue}, 100%, ${62 + 30 * k}%, ${Math.sqrt(k)})`; c.lineWidth = p.w * Math.sqrt(k) + .5;
    c.beginPath(); c.moveTo(px, py); c.lineTo(p.x + (p.x === px ? .5 : 0), p.y); c.stroke();
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i], k = 1 - f.life++ / 12;
    if (k <= 0) { flashes.splice(i, 1); continue; }
    const g = c.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r || 90);
    g.addColorStop(0, `hsla(${f.hue}, 100%, 90%, ${k})`); g.addColorStop(1, "transparent");
    c.fillStyle = g; c.beginPath(); c.arc(f.x, f.y, f.r || 90, 0, 7); c.fill();
  }
  c.globalCompositeOperation = "source-over";
}

// Floating diyas on the river: a clay cup and a flickering flame, bobbing on the water.
function drawLamps(t) {
  for (const l of lamps) {
    const k = Math.min(1, (t - l.born) / 500), bob = Math.sin(t / 700 + l.p) * 1.5, s = l.s;
    const x = l.x + Math.sin(t / 2300 + l.p) * 3, y = l.y + bob;
    w2.globalCompositeOperation = "lighter";
    const g = w2.createRadialGradient(x, y - 3 * s, 0, x, y - 3 * s, 22 * s);
    g.addColorStop(0, `rgba(255,190,90,${.55 * k})`); g.addColorStop(1, "transparent");
    w2.fillStyle = g; w2.beginPath(); w2.arc(x, y - 3 * s, 22 * s, 0, 7); w2.fill();
    // Reflection streak on the water.
    w2.fillStyle = `rgba(255,170,70,${.18 * k})`; w2.fillRect(x - 1.2 * s, y + 3 * s, 2.4 * s, 14 * s);
    w2.globalCompositeOperation = "source-over";
    w2.fillStyle = "#6a2a0e"; w2.beginPath(); w2.ellipse(x, y, 5 * s, 2.4 * s, 0, 0, Math.PI); w2.fill();
    const fl = (1 + .12 * Math.sin(t / 90 + l.p * 7)) * k;
    const fg = w2.createRadialGradient(x, y - 3.5 * s * fl, 0, x, y - 3.5 * s * fl, 4.5 * s * fl);
    fg.addColorStop(0, "#fff"); fg.addColorStop(.4, "#ffd27a"); fg.addColorStop(1, "rgba(255,120,30,0)");
    w2.fillStyle = fg; w2.beginPath(); w2.ellipse(x, y - 3.5 * s * fl, 2.2 * s * fl, 4.5 * s * fl, 0, 0, 7); w2.fill();
  }
}

// Embers from a burst fly on a ballistic arc and become diyas where they land.
function drawEmbers(t) {
  for (let i = embers.length - 1; i >= 0; i--) {
    const e = embers[i], px = e.x, py = e.y;
    e.vy += e.g; e.x += e.vx; e.y += e.vy; e.t++;
    c.globalCompositeOperation = "lighter";
    c.strokeStyle = "rgba(255,200,110,.9)"; c.lineWidth = 2; c.beginPath(); c.moveTo(px, py); c.lineTo(e.x, e.y); c.stroke();
    c.globalCompositeOperation = "source-over";
    if (e.t >= e.T) { embers.splice(i, 1); lamps.push({ x: e.tx, y: e.ty, s: .6 + (e.ty / H - .55) * 1.6, p: Math.random() * 6, born: t }); }
  }
}

// Petals: marigold and rose, tumbling down.
const PETAL_COLORS = ["#ff9a1f", "#ffc93c", "#ff7a1a", "#e8334a", "#ffb347"];
function rainPetals(n, x0) {
  for (let i = 0; i < n; i++) petals.push({ x: x0 ?? Math.random() * W, y: -20 - Math.random() * H * .4, vx: (Math.random() - .5) * 1.2, vy: 1 + Math.random() * 1.6,
    r: Math.random() * 6, vr: (Math.random() - .5) * .12, s: 4 + Math.random() * 4, col: PETAL_COLORS[i % PETAL_COLORS.length], p: Math.random() * 6 });
}
function drawPetals(t) {
  for (let i = petals.length - 1; i >= 0; i--) {
    const p = petals[i]; p.x += p.vx + Math.sin(t / 500 + p.p) * .6; p.y += p.vy; p.r += p.vr;
    if (p.y > H + 20) { petals.splice(i, 1); continue; }
    c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.scale(1, Math.abs(Math.cos(t / 300 + p.p)) * .7 + .3);
    c.fillStyle = p.col; c.beginPath(); c.ellipse(0, 0, p.s, p.s * .55, 0, 0, 7); c.fill(); c.restore();
  }
}

// The name, revealed left to right in fire.
let word = null, writeT0 = 0;
const WRITE_MS = 2400;
function layoutWord() {
  const slot = $("nameSlot").getBoundingClientRect();
  const fs = Math.min(W * .3, slot.height * .95, 150);
  const off = document.createElement("canvas"), o = off.getContext("2d");
  o.font = `${fs}px "Yatra One"`;
  const tw = Math.ceil(o.measureText(TO_HI).width + fs * .3), th = Math.ceil(fs * 1.6);
  off.width = tw; off.height = th;
  o.font = `${fs}px "Yatra One"`; o.textBaseline = "middle"; o.fillStyle = "#ffe4a8"; o.fillText(TO_HI, fs * .15, th / 2);
  const d = o.getImageData(0, 0, tw, th).data, cols = [];
  for (let x = 0; x < tw; x++) {
    let top = -1, bot = -1;
    for (let y = 0; y < th; y++) if (d[(y * tw + x) * 4 + 3] > 80) { if (top < 0) top = y; bot = y; }
    cols.push(top < 0 ? null : [top, bot]);
  }
  const first = cols.findIndex(Boolean), last = cols.length - 1 - [...cols].reverse().findIndex(Boolean);
  word = { off, tw, th, cols, first, last, x: (W - tw) / 2, y: slot.top + slot.height * .55 - th / 2, done: word ? word.done : false };
}
function drawWord(t) {
  if (!word) return;
  const k = Math.min(1, (t - writeT0) / WRITE_MS), w = word;
  const edge = w.first + (w.last - w.first) * k;
  w2.save();
  w2.beginPath(); w2.rect(w.x, w.y, edge, w.th); w2.clip();
  w2.shadowColor = "#ff7a1f"; w2.shadowBlur = 28;
  w2.globalAlpha = k < 1 ? 1 : .88 + .12 * Math.sin(t / 140);
  w2.drawImage(w.off, w.x, w.y);
  w2.shadowColor = "#fff2c4"; w2.shadowBlur = 6; w2.drawImage(w.off, w.x, w.y);
  w2.restore();
  if (k < 1) {
    let col = w.cols[Math.round(edge)];
    for (let i = 1; !col && i < 20; i++) col = w.cols[Math.round(edge) - i];
    const [top, bot] = col || [w.th * .4, w.th * .6];
    const hx = w.x + edge, hy = w.y + top + (bot - top) * (.5 + .5 * Math.sin(t / 55));
    spark(hx, hy, reduce ? 2 : 8, { speed: 3.2, life: 18, g: .07 });
    c.globalCompositeOperation = "lighter";
    const g = c.createRadialGradient(hx, hy, 0, hx, hy, 26);
    g.addColorStop(0, "#fff"); g.addColorStop(.3, "#ffb347"); g.addColorStop(1, "transparent");
    c.fillStyle = g; c.beginPath(); c.arc(hx, hy, 26, 0, 7); c.fill();
    c.globalCompositeOperation = "source-over";
  } else if (!w.done) {
    w.done = true; if (writing) writing.pause();
    track("deepkatha-written");
  }
}

// Fireworks in festival colours.
const rockets = [];
const HUES = [38, 18, 340, 50, 300, 120];
function launch(x, y) {
  rockets.push({ x: x ?? W * (.15 + Math.random() * .7), y: H * .7, ty: y ?? H * (.1 + Math.random() * .25), hue: HUES[Math.floor(Math.random() * HUES.length)] });
}
function drawRockets() {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.y -= Math.max(6, (r.y - r.ty) * .07);
    spark(r.x, r.y, 1, { speed: .6, life: 12, hue: 40, g: .02 });
    if (r.y - r.ty < 4) {
      rockets.splice(i, 1); flashes.push({ x: r.x, y: r.y, hue: r.hue, life: 0 });
      spark(r.x, r.y, reduce ? 40 : 150, { speed: 6.2, life: 72, hue: r.hue, g: .035, drag: .95, w: 3 });
      spark(r.x, r.y, reduce ? 8 : 40, { speed: 2.4, life: 60, hue: 45, g: .03, drag: .95, w: 1.6 });
      if (finaleOn) sfx("fc", .4);
    }
  }
}

let finaleOn = false, autoShow = 0, flying = null;
function frame() {
  const t = performance.now();
  if (finaleOn) { c.globalCompositeOperation = "destination-out"; c.fillStyle = "rgba(0,0,0,.18)"; c.fillRect(0, 0, W, H); c.globalCompositeOperation = "source-over"; }
  else c.clearRect(0, 0, W, H);
  w2.clearRect(0, 0, W, H);
  if (scene === "s-bow" || scene === "s-finale") drawLamps(t);
  drawWord(t); drawArrow(); drawEmbers(t); drawRockets(); drawParts(); drawPetals(t);
  requestAnimationFrame(frame);
}

// 1 · The pothi opens with a conch.
$("openBtn").addEventListener("click", () => {
  music.play().catch(() => {}); $("mute").classList.add("on");
  sfx("shankh", .6); track("deepkatha-start");
  page = 0; setKatha(0); show("s-katha");
});

// 2 · Three painted pages of the katha.
let page = 0;
function setKatha(i) {
  $("kImg").src = KATHA[i].img; $("kHi").textContent = KATHA[i].hi; $("kEn").textContent = KATHA[i].en;
  [...$("kDots").children].forEach((d, j) => d.classList.toggle("on", j === i));
  $("kNext").textContent = i === KATHA.length - 1 ? "🏹 Dhanush uthao" : "Aage ›";
}
async function turn(folio, update) {
  folio.classList.add("turn"); await wait(reduce ? 50 : 450); update(); folio.classList.remove("turn");
}
$("kNext").addEventListener("click", () => {
  if (page < KATHA.length - 1) { page++; sfx("whoosh", .25); turn($("kFolio"), () => setKatha(page)); track("deepkatha-page", { n: page + 1 }); return; }
  show("s-bow"); buildBow(); track("deepkatha-bow");
});

// 3 · The bow: pull the string down, let go, and a fire arrow climbs, bursts, and rains diyas on the Sarayu.
let pull = 0, dragging = null, shots = 0, busy = false;
function buildBow() {
  shots = 0; lamps.length = 0; setPull(0); $("tipFire").setAttribute("opacity", 0);
  document.documentElement.style.setProperty("--lit", 0);
  $("arrows").textContent = Array(ARROWS).fill("🔥").join(" ");
  $("bowDone").classList.remove("on"); $("toYaad").classList.remove("on"); $("bowwrap").style.display = ""; $("handhint").style.display = "";
}
function setPull(p) {
  pull = p;
  $("string").setAttribute("d", `M8 74 L100 ${74 + p} L192 74`);
  $("arrow").setAttribute("transform", `translate(0 ${p})`);
  $("tipFire").setAttribute("opacity", Math.min(1, p / 40));
}
const svgScale = () => $("bowwrap").getBoundingClientRect().width / 200;
$("s-bow").addEventListener("pointerdown", e => {
  if (busy || shots >= ARROWS || e.target.closest("button")) return;
  dragging = { y: e.clientY, moved: false }; $("handhint").style.display = "none";
});
addEventListener("pointermove", e => {
  if (!dragging) return;
  const p = Math.max(0, Math.min(56, (e.clientY - dragging.y) / svgScale()));
  if (p > 4) dragging.moved = true;
  setPull(p);
});
addEventListener("pointerup", async () => {
  if (!dragging) return;
  const d = dragging; dragging = null;
  if (!d.moved) {  // A plain tap draws the bow by itself.
    busy = true;
    for (let p = 0; p <= 56; p += 4) { setPull(p); await wait(16); }
    busy = false;
  }
  if (pull > 24) shoot(); else setPull(0);
});
function shoot() {
  const r = $("bowwrap").getBoundingClientRect(), s = svgScale();
  const x = r.left + 100 * s, y = r.top + (70 - 56 + pull) * s;
  flying = { x, y, vy: -6, ty: H * (.18 + Math.random() * .08) };
  setPull(0); $("tipFire").setAttribute("opacity", 0); sfx("whoosh", .6);
  shots++; $("arrows").textContent = Array(ARROWS - shots).fill("🔥").join(" ") || "✨";
  track("deepkatha-arrow", { n: shots });
}
function drawArrow() {
  const a = flying; if (!a) return;
  a.vy *= 1.06; a.y += a.vy;
  c.globalCompositeOperation = "lighter";
  c.strokeStyle = "rgba(255,220,150,.95)"; c.lineWidth = 3; c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(a.x, a.y + 46); c.stroke();
  const g = c.createRadialGradient(a.x, a.y, 0, a.x, a.y, 22); g.addColorStop(0, "#fff"); g.addColorStop(.4, "#ffb347"); g.addColorStop(1, "transparent");
  c.fillStyle = g; c.beginPath(); c.arc(a.x, a.y, 22, 0, 7); c.fill();
  c.globalCompositeOperation = "source-over";
  spark(a.x, a.y + 10, reduce ? 1 : 4, { dir: Math.PI / 2, spread: .5, speed: 2, life: 20, g: .05 });
  if (a.y <= a.ty) { flying = null; burst(a.x, a.y); }
}
function burst(x, y) {
  flashes.push({ x, y, hue: 38, life: 0, r: 140 }); sfx("fc", .5);
  spark(x, y, reduce ? 30 : 120, { speed: 6, life: 50, g: .05, w: 2.4 });
  const n = reduce ? 18 : 46;
  for (let i = 0; i < n; i++) {
    // Each ember lands somewhere on the river; this shot covers its own stretch of water.
    const tx = W * (.06 + Math.random() * .88), ty = H * (.6 + Math.random() * .3);
    const T = 50 + Math.random() * 40, g = .12;
    embers.push({ x, y, tx, ty, T, t: 0, g, vx: (tx - x) / T, vy: (ty - y) / T - .5 * g * T });
  }
  document.documentElement.style.setProperty("--lit", (shots / ARROWS) * .92);
  if (shots >= ARROWS) setTimeout(bowDone, 2600);
}
function bowDone() {
  sfx("shankh", .5); track("deepkatha-sarayu");
  $("bowwrap").style.display = "none";
  $("bowDone").innerHTML = `Sarayu <b>jagmaga</b> uthi 🪔`;
  $("bowDone").classList.add("on");
  setTimeout(() => $("toYaad").classList.add("on"), 900);
}

// 4 · Pushpak flies stop to stop; each stop opens a memory page.
let stop = 0;
const STOP_X = i => 6 + i * 88 / (MEMORIES.length - 1);
$("toYaad").addEventListener("click", () => {
  const route = $("route");
  route.querySelectorAll(".stop").forEach(s => s.remove());
  MEMORIES.forEach((_, i) => { const s = document.createElement("i"); s.className = "stop"; s.style.left = STOP_X(i) + "%"; route.appendChild(s); });
  stop = 0; setMemory(0); show("s-yaad"); track("deepkatha-yaad");
});
function setMemory(i) {
  const m = MEMORIES[i];
  $("mImg").src = m.img; $("mTitle").textContent = m.title; $("mText").textContent = m.text;
  $("vimaan").style.left = STOP_X(i) + "%";
  $("route").querySelectorAll(".stop").forEach((s, j) => s.classList.toggle("on", j <= i));
  $("mNext").textContent = i === MEMORIES.length - 1 ? "🏠 Ghar pahunche" : "Agla padav ›";
  sfx("ghanta", .25);
}
$("mNext").addEventListener("click", () => {
  if (stop < MEMORIES.length - 1) { stop++; turn($("mFolio"), () => setMemory(stop)); track("deepkatha-padav", { n: stop + 1 }); return; }
  toDoors();
});

// 5 · Home: the doors open onto the lit Sarayu, the name in fire, petals and fireworks.
function toDoors() {
  show("s-finale"); document.body.classList.add("finale");
  $("doors").classList.remove("open"); $("doors").classList.add("on");
  $("letter").classList.remove("on"); word = null;
}
let writing = null;
async function openDoors() {
  if ($("doors").classList.contains("open")) return;
  $("doors").classList.add("open"); sfx("ghanta", .6); sfx("shankh", .5); track("deepkatha-finale");
  rainPetals(reduce ? 30 : 90);
  await wait(1500); $("doors").classList.remove("on");
  finaleOn = true;
  await document.fonts.load('100px "Yatra One"').catch(() => {});
  word = null; layoutWord(); writeT0 = performance.now();
  writing = sfx("sparkle", .5); if (writing) writing.loop = true;
  await wait(WRITE_MS);
  let n = 0; clearInterval(autoShow);
  launch(W * .25, H * .2); launch(W * .75, H * .15);
  autoShow = setInterval(() => { launch(); if (Math.random() < .5) launch(); if (n % 4 === 0) rainPetals(reduce ? 4 : 16); if (++n > 16) clearInterval(autoShow); }, 500);
  await wait(2400); $("letter").classList.add("on");
}
$("doors").addEventListener("click", openDoors);
document.addEventListener("pointerdown", e => {
  if (!finaleOn || e.target.closest(".letter, .row, .made, #mute")) return;
  launch(e.clientX, e.clientY); rainPetals(reduce ? 3 : 10, e.clientX);
});
$("replay").addEventListener("click", () => {
  finaleOn = false; clearInterval(autoShow); parts.length = rockets.length = embers.length = petals.length = lamps.length = 0; word = null;
  if (writing) writing.pause();
  document.body.classList.remove("finale"); $("letter").classList.remove("on");
  show("s-intro");
});

addEventListener("resize", size);
size(); requestAnimationFrame(frame);
</script>
